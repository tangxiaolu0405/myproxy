name: Build and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build-linux-windows:
    name: Build Windows / Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache: true

      - name: Generate Icon.png
        run: go run ./tools/genicon

      - name: Install fyne-cross
        run: go install github.com/fyne-io/fyne-cross@latest

      - name: Add Go bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # fyne 2.5.x 用 go mod edit -json 的 CombinedOutput 解析版本；工具链首次下载的 stderr 会混入导致 JSON 报错。
      # 用与 fyne-cross 相同的 /go 缓存挂载先拉取模块与工具链，再执行打包。
      - name: Prime Go module and toolchain in fyne-cross cache
        run: |
          set -e
          CACHE="${HOME}/.cache/fyne-cross"
          mkdir -p "$CACHE" "${{ github.workspace }}/fyne-cross/bin" "${{ github.workspace }}/fyne-cross/dist" "${{ github.workspace }}/fyne-cross/tmp"
          prime() {
            docker run --rm --platform linux/amd64 \
              -u "$(id -u):$(id -g)" \
              -e HOME=/tmp \
              -e CGO_ENABLED=1 \
              -e GOTOOLCHAIN=auto \
              -e GOCACHE=/go/go-build \
              -e GOMODCACHE=/go/pkg/mod \
              -v "${{ github.workspace }}:/app" \
              -v "${CACHE}:/go" \
              -w /app \
              "$1" \
              bash -ec 'export PATH="/usr/local/go/bin:$PATH" && mkdir -p /go/go-build /go/pkg/mod && go mod download'
          }
          prime fyneio/fyne-cross-images:windows
          prime fyneio/fyne-cross-images:linux

      # fyne-cross 镜像内 Go 可能低于 go.mod；GOTOOLCHAIN=auto 在容器内按需使用已缓存的工具链。
      # 显式 -arch amd64，避免随 runner GOARCH 漂移；产物目录为 fyne-cross/dist/<os>-<arch>/
      - name: Resolve app version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          # 发版（v* tag）用完整 tag 名作为版本；非发版构建固定为 dev，避免展示短 hash 误导
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            ver="${GITHUB_REF_NAME}"
          else
            ver="dev"
          fi
          echo "version=${ver}" >> "$GITHUB_OUTPUT"
          echo "Resolved APP_VERSION=${ver}"

      - name: Build for Windows and Linux
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          echo "Building with main.version=${APP_VERSION}"
          # fyne-cross 会按空格拆分 -ldflags；使用 -X=name=value 单 token，避免拆坏
          fyne-cross windows -arch amd64 -app-id com.lucastq.myproxy -output LProxy \
            -ldflags "-X=main.version=${APP_VERSION}" -env GOTOOLCHAIN=auto ./cmd/gui
          fyne-cross linux -arch amd64 -app-id com.lucastq.myproxy -output LProxy \
            -ldflags "-X=main.version=${APP_VERSION}" -env GOTOOLCHAIN=auto ./cmd/gui
          # 校验二进制是否已注入版本（Windows 产物为 zip 时跳过；Linux 可从 bin 校验）
          if [ -f "fyne-cross/bin/linux-amd64/LProxy" ]; then
            strings "fyne-cross/bin/linux-amd64/LProxy" | grep -F "${APP_VERSION}" \
              || echo "WARN: version string ${APP_VERSION} not found in linux binary (check -ldflags)"
          fi

      - name: Normalize release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          # fyne-cross 输出（-output LProxy）：
          #   fyne-cross/dist/windows-amd64/LProxy.zip
          #   fyne-cross/dist/linux-amd64/LProxy.tar.xz
          # 归一命名对齐 cata：LProxy-<os>-<arch>.<ext>
          shopt -s nullglob
          pack_platform() {
            local os="$1" arch="$2"
            local dir="fyne-cross/dist/${os}-${arch}"
            local f out ext
            if [ ! -d "$dir" ]; then
              echo "missing dist dir: $dir" >&2
              return 1
            fi
            f=""
            for cand in "$dir"/*.zip "$dir"/*.tar.xz "$dir"/*.tar.gz; do
              [ -f "$cand" ] || continue
              f="$cand"
              break
            done
            if [ -z "$f" ]; then
              echo "no archive under $dir:" >&2
              ls -la "$dir" >&2 || true
              return 1
            fi
            case "$f" in
              *.tar.xz) ext="tar.xz" ;;
              *.tar.gz) ext="tar.gz" ;;
              *.zip)    ext="zip" ;;
              *) echo "unsupported archive: $f" >&2; return 1 ;;
            esac
            out="release-assets/LProxy-${os}-${arch}.${ext}"
            cp -f "$f" "$out"
            echo "asset: $out (from $f)"
          }
          pack_platform windows amd64
          pack_platform linux amd64
          echo "---- release assets ----"
          ls -la release-assets

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: myproxy-linux-windows
          path: release-assets/*

  # macOS：fyne-cross 在 macos-latest 上依赖 Docker/Podman（engine binary not found in PATH）。
  # 恢复发布时请安装 Docker Desktop 并改用 engine docker，或在本机用 fyne package 打 .app 后单独上传。
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate release notes from commits
        shell: bash
        env:
          CURRENT_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          PREV_TAG=$(git describe --tags --abbrev=0 "${CURRENT_TAG}^" 2>/dev/null || true)

          write_commit_log() {
            git log "$@" --reverse --format=%H | while IFS= read -r sha; do
              subject=$(git show -s --format=%s "$sha")
              short=$(git show -s --format=%h "$sha")
              body=$(git show -s --format=%b "$sha")
              printf -- '- %s (`%s`)\n' "$subject" "$short"
              # %b 含 commit body；多行时缩进挂在同一列表项下，避免只保留 subject 丢信息
              if [ -n "${body//[[:space:]]/}" ]; then
                while IFS= read -r line || [ -n "$line" ]; do
                  printf '  %s\n' "$line"
                done <<< "$body"
              fi
              echo
            done
          }

          {
            echo "## ${CURRENT_TAG}"
            echo
            if [ -n "${PREV_TAG}" ]; then
              echo "Changes since \`${PREV_TAG}\`:"
            else
              echo "Initial release (all commits):"
            fi
            echo
            if [ -n "${PREV_TAG}" ]; then
              write_commit_log "${PREV_TAG}..${CURRENT_TAG}"
            else
              write_commit_log
            fi
            echo
            echo "## Downloads"
            echo
            while IFS= read -r f; do
              printf -- '- `%s`\n' "$(basename "$f")"
            done < <(find artifacts -type f | sort)
            echo
            echo "- macOS: 暂未由 CI 发布（见 workflow 注释）"
            echo
            echo '```bash'
            if [ -f artifacts/LProxy-linux-amd64.tar.xz ]; then
              echo "tar -xJf LProxy-linux-amd64.tar.xz   # 解压后运行包内二进制"
            elif [ -f artifacts/LProxy-linux-amd64.tar.gz ]; then
              echo "tar -xzf LProxy-linux-amd64.tar.gz   # 解压后运行包内二进制"
            fi
            if [ -f artifacts/LProxy-windows-amd64.zip ]; then
              echo "unzip LProxy-windows-amd64.zip && LProxy.exe"
            fi
            echo '```'
          } > release_notes.md

          echo "---- release notes preview ----"
          head -60 release_notes.md

      - name: List release assets
        run: find artifacts -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: |
            artifacts/LProxy-windows-amd64.*
            artifacts/LProxy-linux-amd64.*
          draft: false
          prerelease: false
